[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepfast"
version = "0.1.0"
description = "AI retention analyst for builders — connects PostHog + Stripe, speaks plain language"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
keepfast = "keepfast.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keepfast"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
